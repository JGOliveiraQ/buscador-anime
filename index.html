<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ee5f9b">
  <meta name="description" content="Pesquisa de animes com suporte a PWA e geolocalização.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>Pesquisa de Animes</title>
  <link rel="preconnect" href="https://graphql.anilist.co">
  <link rel="preconnect" href="https://cdn.myanimelist.net">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="pagina-inicial">
    <section class="cabecalho" aria-labelledby="titulo-principal">
      <div>
        <p class="etiqueta">PWA · ANIME</p>
        <h1 id="titulo-principal">Buscador de Animes</h1>
        <p class="subtitulo">Encontre seus animes favoritos e veja informações completas.</p>
      </div>
      <button class="botao-localizacao" id="botao-localizacao" type="button">📍 Usar minha localização</button>
    </section>

    <section class="area-busca" aria-label="Pesquisa">
      <form class="busca" id="form-busca" role="search">
        <label class="sr-only" for="campo-busca">Pesquisar anime</label>
        <input id="campo-busca" type="search" placeholder="Ex.: Frieren, Naruto, Haikyuu" autocomplete="off">
        <button type="submit">Buscar</button>
      </form>
      <p class="status-localizacao" id="status-localizacao" aria-live="polite"></p>
    </section>

    <section class="resultados" aria-label="Resultados da busca">
      <div class="mensagem" id="mensagem" aria-live="polite" hidden></div>
      <div class="grade-animes" id="grade-animes"></div>
    </section>
  </main>

  <dialog class="modal" id="modal-detalhes" aria-labelledby="modal-titulo">
    <button class="fechar-modal" id="fechar-modal" type="button" aria-label="Fechar detalhes">×</button>
    <div class="modal-conteudo" id="modal-conteudo"></div>
  </dialog>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
