<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7000ff" />
  <meta name="description" content="Aplicação PWA para busca e consulta de animes com integração a recursos de hardware." />
  
  <title>Buscador de Anime PWA</title>

  <!-- PWA e Ícones -->
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Estilização CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header>
    <h1>Buscador de Anime</h1>
    <!-- Botão de Instalação PWA (exibido apenas se o navegador suportar instalação) -->
    <button id="install-btn" style="display: none;">Instalar App</button>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    
    <!-- 1. Seção da Barra de Busca -->
    <section class="search-section">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Digite o nome de um anime (ex: Naruto)..." 
        aria-label="Digitar nome do anime"
      />
      <button id="search-btn">Buscar</button>
    </section>

    <!-- 2. Seção do Recurso de Hardware (Geolocalização / GPS) -->
    <section class="hardware-feature">
      <h2>Recurso do Dispositivo (GPS)</h2>
      <button id="geo-btn">Obter Minha Localização</button>
      <p id="geo-output">Clique no botão acima para permitir o acesso à sua localização.</p>
    </section>

    <!-- 3. Seção do Grid com os Resultados dos Animes -->
    <section id="results-container" class="results-grid" aria-live="polite"></section>

  </main>

  <!-- Lógica da Aplicação JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
